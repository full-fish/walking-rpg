<!doctype html>
<!-- StepQuest 그림 모음. 목록(SPRITES)은 `node tools/crop-sprites.mjs`가 다시 쓴다 — 손으로 고치지 않는다 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StepQuest 그림 모음</title>
    <style>
      :root {
        --cell: 72px;
        --bg: #1a1626;
        --panel: #2a2438;
        --edge: #4a4260;
        --text: #e8e4f0;
        --dim: #a8a0bc;
        --gold: #e0b84a;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0 16px 32px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 12px 0 8px;
        background: var(--bg);
        border-bottom: 1px solid var(--edge);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      h1 small,
      h2 small {
        color: var(--dim);
        font-weight: normal;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
      }
      .chips button {
        padding: 4px 10px;
        border: 1px solid var(--edge);
        border-radius: 14px;
        background: var(--panel);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .chips button.on {
        border-color: var(--gold);
        background: var(--gold);
        color: var(--bg);
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input[type='range'] {
        flex: 1;
        max-width: 320px;
      }
      h2 {
        margin: 16px 0 6px;
        font-size: 15px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr));
        gap: 4px;
      }
      .grid a {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 0;
        padding: 2px;
        border-radius: 4px;
        background: var(--panel);
        color: var(--dim);
        font-size: 11px;
        text-decoration: none;
      }
      .grid a:hover {
        outline: 1px solid var(--gold);
      }
      .grid img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: contain;
      }
      .grid span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .small .grid span {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>StepQuest 그림 모음 <small id="count"></small></h1>
      <div class="chips" id="chips"></div>
      <label>칸 크기 <input id="size" type="range" min="32" max="320" step="8" value="72" /> <output id="px">72px</output></label>
    </header>
    <main id="main"></main>

undead/undead_18.png","monsters/undead/undead_19.png","monsters/undead/undead_21.png","monsters/undead/undead_22.png","monsters/undead/undead_23.png","monsters/undead/undead_25.png"]}];/* sprites:end */

      const $ = (id) => document.getElementById(id);
      const name = (file) => file.split('/').pop().replace('.png', '');
      const total = (list) => list.reduce((n, k) => n + k.files.length, 0);
      const views = [
        ['all', '전체', SPRITES],
        ['item', '장비 · 반지 · 화살', SPRITES.filter((k) => k.group === 'item')],
        ['monster', '몬스터', SPRITES.filter((k) => k.group === 'monster')],
        ...SPRITES.map((k) => [k.kind, k.label, [k]]),
      ];
      let view = 'all';

      function render() {
        const shown = views.find(([id]) => id === view)[2];
        $('count').textContent = `${total(shown)}장`;
        $('chips').innerHTML = views
          .map(([id, label, list]) => `<button data-id="${id}" class="${id === view ? 'on' : ''}">${label} ${total(list)}</button>`)
          .join('');
        $('main').innerHTML = shown
          .map(
            (k) =>
              `<h2>${k.label} <small>${k.kind} · ${k.files.length}</small></h2><div class="grid">` +
              k.files
                .map((f) => `<a href="${f}" target="_blank" title="${name(f)}"><img src="${f}" alt="${name(f)}" loading="lazy" /><span>${name(f)}</span></a>`)
                .join('') +
              '</div>',
          )
          .join('');
      }

      $('chips').onclick = (e) => {
        const id = e.target.dataset?.id;
        if (!id) return;
        view = id;
        render();
      };
      // 작은 칸에서는 이름을 숨긴다 — 글자가 그림을 가린다
      $('size').oninput = () => {
        const px = Number($('size').value);
        document.documentElement.style.setProperty('--cell', `${px}px`);
        document.body.classList.toggle('small', px < 64);
        $('px').textContent = `${px}px`;
      };
      render();
    </script>

</html>
